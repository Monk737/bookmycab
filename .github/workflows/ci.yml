name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service

  db-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # Start the local stack (applies all migrations) — this is the migration gate.
      - run: supabase start
      # Lint migrations for SQL issues (migration dry-run gate).
      - run: supabase db lint --level warning
      # Bring up the automation engine stack (SRH + n8n) so the redis-integration
      # test runs against a real SRH. The engine-client live test is exercised
      # locally by the executor and stays optional in CI (it self-skips unless the
      # N8N_API_KEY / N8N_TEST_WORKFLOW_ID secrets are present).
      - name: Start automation engine stack
        run: docker compose -f docker-compose.engine.yml up -d
      - name: Wait for SRH + n8n
        run: |
          # SRH speaks the Upstash command-array protocol (POST / with ["PING"]),
          # not path-based /set or /get URLs.
          for i in $(seq 1 30); do
            curl -sf -X POST http://localhost:8079/ -H "Authorization: Bearer local-dev-srh-token" -H 'content-type: application/json' -d '["PING"]' && break || sleep 2
          done
          for i in $(seq 1 30); do curl -sf http://localhost:5678/healthz && break || sleep 2; done
      - name: Engine env for tests
        run: |
          echo "UPSTASH_REDIS_REST_URL=http://localhost:8079" >> "$GITHUB_ENV"
          echo "UPSTASH_REDIS_REST_TOKEN=local-dev-srh-token" >> "$GITHUB_ENV"
      - name: Run tests (schema + RLS + hook + access)
        run: pnpm test
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - if: always()
        run: supabase stop
