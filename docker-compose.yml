# Production deploy for the BookMyCab Next.js app, fronted by the existing
# Traefik instance on this VPS.
#
#   docker compose --env-file .env.production up -d --build
#
# Notes:
#   - Joins the EXTERNAL `traefik-proxy` network created by Traefik.
#   - Uses the `letsencrypt` HTTP-challenge resolver already configured in Traefik.
#   - The container port (3000) is NOT published to the host; Traefik reaches it
#     over the shared docker network only.
services:
  web:
    build:
      context: .
      args:
        # Build-time public vars (interpolated from --env-file .env.production).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_CAL_LINK: ${NEXT_PUBLIC_CAL_LINK}
    image: bookmycab:latest
    container_name: bookmycab
    restart: unless-stopped
    env_file: .env.production
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"

      # --- HTTPS router ---
      - "traefik.http.routers.bookmycab.rule=Host(`bookmycab.io`) || Host(`www.bookmycab.io`)"
      - "traefik.http.routers.bookmycab.entrypoints=websecure"
      - "traefik.http.routers.bookmycab.tls=true"
      - "traefik.http.routers.bookmycab.tls.certresolver=letsencrypt"
      - "traefik.http.services.bookmycab.loadbalancer.server.port=3000"

      # --- HTTP -> HTTPS redirect ---
      - "traefik.http.routers.bookmycab-web.rule=Host(`bookmycab.io`) || Host(`www.bookmycab.io`)"
      - "traefik.http.routers.bookmycab-web.entrypoints=web"
      - "traefik.http.routers.bookmycab-web.middlewares=bookmycab-redirect"
      - "traefik.http.middlewares.bookmycab-redirect.redirectscheme.scheme=https"

  # Cron sidecar: retry sweep for durable call recordings. Every 5 minutes it
  # POSTs the archive endpoint to copy any Vapi recordings the ingest after()
  # hook missed (process restart, transient download/upload failure). Reaches the
  # app over the shared docker network as `bookmycab:3000` — never the public
  # internet — and authenticates with the same VOICE_INGEST_SECRET as ingest.
  #
  # Host-crontab equivalent (if you prefer cron on the VPS over a sidecar):
  #   */5 * * * * curl -fsS --max-time 120 -X POST https://bookmycab.io/api/voice/recordings/archive -H "Authorization: Bearer $VOICE_INGEST_SECRET"
  recording-archiver:
    image: curlimages/curl:latest
    container_name: bookmycab-recording-archiver
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      - web
    networks:
      - traefik-proxy
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          curl -fsS --max-time 120 -X POST http://bookmycab:3000/api/voice/recordings/archive \
            -H "Authorization: Bearer $$VOICE_INGEST_SECRET" \
            || echo "[recording-archiver] sweep failed at $(date -u +%FT%TZ)";
          sleep 300;
        done

networks:
  traefik-proxy:
    external: true
